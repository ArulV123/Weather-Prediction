<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Globe</title>
<style>
  :root{--bg:#02030a;--panel:rgba(13,19,38,.78);--line:rgba(255,255,255,.12);--text:#eaf1ff;--muted:#8fa3c8;--accent:#5cc8ff;--accent2:#7c8cff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  #globe,#rain{position:fixed;inset:0;width:100%;height:100%}
  #rain{pointer-events:none;z-index:2}
  #globe{cursor:grab;touch-action:none}
  button{font-family:inherit}
  svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  /* ---- top control bar ---- */
  .top{position:fixed;top:14px;left:14px;right:14px;z-index:5;display:flex;flex-direction:column;gap:10px;pointer-events:none}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row>*{pointer-events:auto}
  .glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .brand{display:flex;align-items:center;gap:9px;padding:8px 16px 8px 10px;border-radius:14px;font-weight:650;font-size:15px;letter-spacing:.3px}
  .brand svg{width:24px;height:24px}
  .sbox{position:relative;flex:1;min-width:220px;max-width:420px}
  .sbox>svg.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;opacity:.6;pointer-events:none}
  .search{width:100%;padding:12px 14px 12px 40px;border-radius:14px;color:var(--text);font-size:14.5px;outline:none;transition:.2s}
  .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(92,200,255,.18)}
  .search::placeholder{color:#7d90b4}
  .top .row:first-child{position:relative;z-index:20}
  .spacer{flex:1}

  .seg{display:flex;gap:2px;padding:4px;border-radius:15px}
  .seg button{display:flex;align-items:center;gap:7px;padding:8px 14px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:13.5px;font-weight:500;cursor:pointer;transition:.2s;white-space:nowrap}
  .seg button:hover{color:var(--text);background:rgba(255,255,255,.06)}
  .seg button.on{color:#fff;background:linear-gradient(135deg,rgba(92,200,255,.30),rgba(124,140,255,.30));box-shadow:inset 0 0 0 1px rgba(92,200,255,.6),0 0 14px rgba(92,200,255,.18)}

  .chip{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;color:var(--muted);font-size:13.5px;font-weight:500;cursor:pointer;transition:.2s;white-space:nowrap}
  .chip:hover{color:var(--text);border-color:rgba(255,255,255,.3)}
  .chip .sw{position:relative;width:26px;height:15px;border-radius:99px;background:rgba(255,255,255,.18);transition:.2s;flex:none}
  .chip .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#cfd9f0;transition:.2s}
  .chip.on{color:var(--text)}
  .chip.on .sw{background:var(--accent)}
  .chip.on .sw::after{left:13px;background:#fff}

  .go{display:flex;align-items:center;gap:8px;padding:10px 18px;border:0;border-radius:14px;color:#04101f;background:linear-gradient(135deg,#5cc8ff,#8fa2ff);font-size:13.5px;font-weight:650;cursor:pointer;box-shadow:0 6px 22px rgba(92,200,255,.35);transition:.2s;white-space:nowrap}
  .go:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(92,200,255,.5)}
  .go svg.i{fill:currentColor;stroke:none}
  .ghost{display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:14px;color:var(--text);font-size:13.5px;font-weight:500;cursor:pointer;transition:.2s}
  .ghost:hover{border-color:var(--accent)}

  /* ---- generic small buttons (animation bar) ---- */
  .btn{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);cursor:pointer;font-size:14px;transition:.2s}
  .btn:hover{border-color:var(--accent);background:rgba(92,200,255,.16)}

  /* ---- weather card ---- */
  #card{position:fixed;z-index:5;right:14px;bottom:14px;width:min(360px,calc(100% - 28px));max-height:calc(100vh - 150px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;backdrop-filter:blur(14px);transform:translateY(20px);opacity:0;pointer-events:none;transition:.5s}
  #card.show{transform:none;opacity:1;pointer-events:auto}
  .cn{font-size:13px;color:var(--muted);margin:0}
  .big{display:flex;align-items:center;gap:12px;margin:6px 0}
  .temp{font-size:52px;font-weight:600;line-height:1}
  .icon{font-size:44px}
  .cond{font-size:17px;margin:0 0 10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .grid div{background:rgba(255,255,255,.06);border-radius:10px;padding:7px 10px;font-size:12.5px;color:var(--muted)}
  .grid b{display:block;color:var(--text);font-size:15px;font-weight:600}
  .note{margin:0 0 12px;font-size:11px;line-height:1.4;color:#6f84ab}
  .fc{display:flex;gap:6px;overflow-x:auto}
  .fc div{flex:1;min-width:58px;text-align:center;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 4px;font-size:12px;color:var(--muted)}
  .fc span{display:block;font-size:20px;margin:2px 0}
  .fc b{color:var(--text)}
  .badge{display:inline-block;margin-bottom:8px;padding:3px 10px;border-radius:99px;background:rgba(92,200,255,.18);color:var(--accent);font-size:12px}
  #hint{position:fixed;z-index:4;left:50%;bottom:22px;transform:translateX(-50%);font-size:13px;color:var(--muted);transition:.4s;text-align:center;pointer-events:none;max-width:40vw}
  #res{z-index:30;position:absolute;top:100%;left:0;right:0;margin-top:6px;background:rgba(12,18,34,.96);border:1px solid rgba(255,255,255,.18);border-radius:14px;overflow:hidden;display:none;max-height:300px;overflow-y:auto}
  #res div{padding:10px 14px;font-size:14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06)}
  #res div:hover{background:rgba(92,200,255,.18)}
  #res small{color:var(--muted)}

  /* ---- animation bar ---- */
  #anim{flex-wrap:wrap;position:fixed;z-index:6;left:14px;bottom:14px;width:min(470px,calc(100% - 28px));display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:9px 12px;backdrop-filter:blur(14px);font-size:13px}
  #ainfo{position:fixed;z-index:6;left:14px;bottom:158px;max-height:calc(100vh - 330px);overflow-y:auto;width:min(470px,calc(100% - 28px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 13px;backdrop-filter:blur(14px);font-size:12.5px;line-height:1.5}
  #chart{flex-basis:100%;width:100%;height:64px}
  #as{accent-color:var(--accent)}
  #msg{position:fixed;z-index:8;left:50%;bottom:58px;transform:translateX(-50%);max-width:min(560px,calc(100% - 28px));padding:8px 16px;border-radius:99px;background:rgba(13,19,38,.92);border:1px solid var(--line);font-size:13px;color:#ffd9a8;text-align:center;pointer-events:none}
  #msg:empty{display:none}
  @media(max-width:700px){.brand span{display:none}.seg button span{display:none}.seg button{padding:9px 12px}}
</style>
</head>
<body>
<canvas id="globe"></canvas>
<canvas id="rain"></canvas>

<div class="top">
  <div class="row">
    <div class="brand glass">
      <svg viewBox="0 0 24 24"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5cc8ff"/><stop offset="1" stop-color="#8fa2ff"/></linearGradient></defs><circle cx="12" cy="12" r="10" fill="url(#bg1)"/><path d="M4 11c2-1 3-3 6-3s2 3 5 3 3-2 5-1M6 17c2-1 4 0 6-1s3-1 6 0" fill="none" stroke="#04101f" stroke-width="1.5" stroke-linecap="round" opacity=".55"/></svg>
      <span>Weather Globe</span>
    </div>
    <div class="sbox">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" class="search glass" placeholder="Search any city or country (e.g. Chennai)…" autocomplete="off">
      <div id="res"></div>
    </div>
    <div class="spacer"></div>
    <button class="ghost glass" id="reset" title="Back to Earth view"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Reset view</button>
  </div>
  <div class="row">
    <div class="seg glass">
      <button class="lyr on" data-l="truecolor" title="NASA true-colour satellite photo"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span>True colour</span></button>
      <button class="lyr" data-l="ir" title="Infrared cloud tops - shows cyclones"><svg class="i" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 1 9 9M12 21a9 9 0 0 1-9-9M12 7a5 5 0 0 1 5 5M12 17a5 5 0 0 1-5-5"/><circle cx="12" cy="12" r="1.2"/></svg><span>Cloud / cyclone</span></button>
      <button class="lyr" data-l="rain" title="Satellite rainfall rate"><svg class="i" viewBox="0 0 24 24"><path d="M7 15a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 8.5 3.25 3.25 0 0 1 17 15H7z"/><path d="M9 18.5l-1 2.5M13 18.5l-1 2.5M17 18.5l-1 2.5"/></svg><span>Rain rate</span></button>
    </div>
    <button class="chip glass on" id="refbtn" title="Country borders and names"><i class="sw"></i>Borders &amp; names</button>
    <button class="chip glass" id="allst" title="Detailed state lines for every country (~20 MB download)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>All states</button>
    <button class="go" id="animbtn"><svg class="i" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>Animate + predict storm</button>
  </div>
</div>
<div id="msg"></div>
<div id="ainfo" style="display:none"></div>
<div id="anim" style="display:none"><canvas id="chart" width="470" height="64"></canvas><button class="btn" id="ap">⏸</button><input type="range" id="as" min="0" value="0" style="flex:1"><span id="at"></span><button class="btn" id="arain" title="Show satellite rainfall">🌧</button><button class="btn" id="ax">✕</button></div>
<div id="hint">Drag to spin the Earth · pick a country to see live weather</div>

<div id="card">
  <p class="cn" id="cn"></p>
  <div id="badge"></div>
  <div class="big"><div class="icon" id="ic"></div><div class="temp" id="tp"></div></div>
  <p class="cond" id="cd"></p>
  <div class="grid" id="gr"></div>
  <p class="note">Rain numbers are weather-model values for this exact point. For real satellite rainfall use the Rain rate layer.</p>
  <div class="fc" id="fc"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const FALLBACK=[["India",20.6,78.96],["United States",38,-97],["United Kingdom",54,-2],["Japan",36,138],["Brazil",-14,-51],["Australia",-25,134],["Canada",56,-106],["Germany",51,10],["France",46,2],["China",35,105],["Russia",61,105],["South Africa",-30,25],["Egypt",26,30],["Mexico",23,-102],["Indonesia",-5,120],["Saudi Arabia",24,45],["Argentina",-34,-64],["Norway",62,10],["Kenya",1,38],["Singapore",1.35,103.8]];
let countries=[];
const cache={};

/* ---------- THREE scene ---------- */
const canvas=$('globe');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,.1,100);
camera.position.z=6;
scene.add(new THREE.AmbientLight(0xffffff,.55));
const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(5,2,6);scene.add(sun);

// stars
const sp=[];for(let i=0;i<1500;i++){const r=40+Math.random()*20,a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);sp.push(r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a));}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.12,sizeAttenuation:true})));

const globe=new THREE.Group();scene.add(globe);
const loader=new THREE.TextureLoader();loader.setCrossOrigin('anonymous');
const IMG='https://unpkg.com/three-globe/example/img/';
const earthMat=new THREE.MeshPhongMaterial({color:0x2a6fb5,shininess:12});
const earth=new THREE.Mesh(new THREE.SphereGeometry(2,96,96),earthMat);globe.add(earth);

loader.load(IMG+'earth-topology.png',t=>{earthMat.bumpMap=t;earthMat.bumpScale=.05;earthMat.needsUpdate=true});
const clouds=new THREE.Mesh(new THREE.SphereGeometry(2.03,64,64),new THREE.MeshPhongMaterial({transparent:true,opacity:0,depthWrite:false}));
globe.add(clouds);
clouds.visible=false;
const atmo=new THREE.Mesh(new THREE.SphereGeometry(2.18,64,64),new THREE.MeshBasicMaterial({color:0x4aa8ff,transparent:true,opacity:.12,side:THREE.BackSide}));
scene.add(atmo);
// location pin
const pin=new THREE.Mesh(new THREE.SphereGeometry(.035,16,16),new THREE.MeshBasicMaterial({color:0xff4d4d}));
const ring=new THREE.Mesh(new THREE.RingGeometry(.06,.075,32),new THREE.MeshBasicMaterial({color:0xff4d4d,side:THREE.DoubleSide,transparent:true}));
pin.visible=ring.visible=false;globe.add(pin);globe.add(ring);
globe.rotation.set(.3,0,0);
setTimeout(()=>setLayer('truecolor'),0);


/* ---------- REAL satellite imagery (NASA GIBS) ---------- */
const GIBS='https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&SRS=EPSG:4326&BBOX=-180,-90,180,90&STYLES=&WIDTH=4096&HEIGHT=2048';
const gibs=(layer,png,time)=>GIBS+'&LAYERS='+layer+'&FORMAT='+(png?'image/png&TRANSPARENT=TRUE':'image/jpeg')+(time?'&TIME='+time:'');
const overlays=[];
function ymd(daysAgo){const d=new Date(Date.now()-daysAgo*864e5);return d.toISOString().slice(0,10);}
function tex(url,ok,fail){loader.load(url,t=>{t.anisotropy=renderer.capabilities.getMaxAnisotropy();ok(t)},undefined,fail);}
function addOverlay(url,r,ir){
  tex(url,t=>{if(ir){t=irTex(t.image)}const m=new THREE.Mesh(new THREE.SphereGeometry(r,96,96),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}));globe.add(m);overlays.push(m);done()},()=>{$('msg').textContent='Satellite layer failed to load (needs internet + normal browser tab).'});
}
function done(){$('msg').textContent='';}
let layerToken=0;
const LAYERS={
  truecolor:{label:'🛰️ True colour',info:'NASA VIIRS true-colour satellite photo (latest full day)'},
  ir:{label:'🌀 Cloud / cyclone (infrared)',info:'Himawari-9 & GOES-East infrared, near real-time (Asia-Pacific & Americas)'},
  rain:{label:'🌧️ Rain rate',info:'NASA IMERG satellite rainfall, near real-time'}
};
function setLayer(name){
  const tok=++layerToken;
  overlays.splice(0).forEach(m=>{globe.remove(m);m.material.map&&m.material.map.dispose();m.material.dispose()});
  document.querySelectorAll('.lyr').forEach(b=>b.classList.toggle('on',b.dataset.l===name));
  $('hint').textContent=LAYERS[name].info+' · scroll to zoom';
  $('msg').textContent='Loading satellite imagery…';
  const fail=()=>{$('msg').textContent='Could not load NASA satellite imagery — open the file in a normal browser tab with internet.'};
  const base=(url)=>tex(url,t=>{if(tok!==layerToken)return;earthMat.map=t;earthMat.color.set(0xffffff);earthMat.needsUpdate=true;done()},fail);
  if(name==='truecolor'){
    tex(gibs('VIIRS_SNPP_CorrectedReflectance_TrueColor',false,ymd(1)),t=>{if(tok!==layerToken)return;earthMat.map=t;earthMat.color.set(0xffffff);earthMat.needsUpdate=true;done()},fail);
  }else{
    base(IMG+'earth-blue-marble.jpg');
    if(name==='ir'){addOverlay(gibs('Himawari_AHI_Band13_Clean_Infrared',true),2.012,true);addOverlay(gibs('GOES-East_ABI_Band13_Clean_Infrared',true),2.014,true);}
    if(name==='rain'){addOverlay(gibs('IMERG_Precipitation_Rate',true),2.012);}
  }
}
document.querySelectorAll('.lyr').forEach(b=>b.onclick=()=>setLayer(b.dataset.l));
addEventListener('wheel',e=>{target.z=Math.max(2.8,Math.min(8,target.z+e.deltaY*.002))},{passive:true});

function ll2v(lat,lon,r){const la=lat*Math.PI/180,lo=lon*Math.PI/180;return new THREE.Vector3(r*Math.cos(la)*Math.cos(lo),r*Math.sin(la),-r*Math.cos(la)*Math.sin(lo));}

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  const r=$('rain');r.width=w;r.height=h;}
addEventListener('resize',resize);resize();

/* ---------- state ---------- */
let downAt=null,mode='idle'; // idle | flying | focused | free
let target={x:0,y:0,z:6},tRot={x:0,y:0};
let raining=false,orbit=0,dragging=false,lx=0,ly=0,focusTime=0;

canvas.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;canvas.style.cursor='grabbing'});
addEventListener('pointerup',()=>{dragging=false;canvas.style.cursor='grab'});
addEventListener('pointermove',e=>{if(!dragging)return;
  if(downAt&&Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>4&&(mode==='flying'||mode==='focused'))mode='free';
  const k=camera.position.z/6;globe.rotation.y+=(e.clientX-lx)*.006*k;globe.rotation.x=Math.max(-1.4,Math.min(1.4,globe.rotation.x+(e.clientY-ly)*.005*k));lx=e.clientX;ly=e.clientY});

function flyTo(lat,lon){
  mode='flying';
  let ry=-Math.PI/2-lon*Math.PI/180;
  const cur=globe.rotation.y;
  ry=cur+(((ry-cur+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI); // shortest path
  tRot={x:lat*Math.PI/180,y:ry};
  target.z=4.1;
  pin.position.copy(ll2v(lat,lon,2.04));ring.position.copy(ll2v(lat,lon,2.042));
  ring.lookAt(ring.position.clone().multiplyScalar(2));
  pin.visible=ring.visible=true;
}

/* ---------- animation loop ---------- */
function loop(t){
  requestAnimationFrame(loop);
  if(mode==='idle'&&!dragging){globe.rotation.y+=.0025;}
  if(mode==='flying'||mode==='focused'){
    const k=mode==='flying'?.045:.03;
    if(mode==='flying'){
      globe.rotation.x+=(tRot.x-globe.rotation.x)*k;
      globe.rotation.y+=(tRot.y-globe.rotation.y)*k;
      if(Math.abs(tRot.y-globe.rotation.y)<.01&&Math.abs(tRot.x-globe.rotation.x)<.01&&Math.abs(camera.position.z-target.z)<.05){mode='focused';focusTime=t;}
    }else if(raining&&!A.mesh){ // raining -> globe keeps slowly rotating around the location
      orbit+=.004;
      globe.rotation.y=tRot.y+Math.sin(orbit)*.35;
      globe.rotation.x=tRot.x+Math.sin(orbit*.7)*.06;
    }else{
      globe.rotation.y+=(tRot.y-globe.rotation.y)*k;globe.rotation.x+=(tRot.x-globe.rotation.x)*k;
    }
  }
  camera.position.z+=(target.z-camera.position.z)*.05;
  clouds.rotation.y+=.0004;
  if(ring.visible){const s=1+((t/900)%1)*1.6;ring.scale.set(s,s,s);ring.material.opacity=1-((t/900)%1);}
  if(window.updateLabels)updateLabels();
  renderer.render(scene,camera);
  drawRain();
}
requestAnimationFrame(loop);

/* ---------- rain overlay ---------- */
const rc=$('rain').getContext('2d');let drops=[],rainOn=false,intensity=0;
function drawRain(){
  const w=$('rain').width,h=$('rain').height;rc.clearRect(0,0,w,h);
  if(!rainOn)return;
  const n=Math.floor(120+intensity*380);
  while(drops.length<n)drops.push({x:Math.random()*w,y:Math.random()*h,l:10+Math.random()*18,s:12+Math.random()*10});
  drops.length=n;
  rc.strokeStyle='rgba(170,210,255,.45)';rc.lineWidth=1.2;rc.beginPath();
  for(const d of drops){rc.moveTo(d.x,d.y);rc.lineTo(d.x-d.l*.18,d.y+d.l);d.y+=d.s;d.x-=d.s*.18;if(d.y>h){d.y=-20;d.x=Math.random()*w+60}}
  rc.stroke();
}

/* ---------- weather ---------- */

   - the cyclone's own rotation (fast core, slower outskirts -> the spiral arms keep winding),

/* find the storm in every frame (dense cold-cloud blob near the chosen place), follow it back in time to where it formed,
   and measure its size/strength proxy (area of cold cloud tops) */
function analyze(got,b,loc){
  const cell=.5,gw=Math.round((b.lon1-b.lon0)/cell),gh=Math.round((b.lat1-b.lat0)/cell),cw=gw*5,ch=gh*5;
  const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const cx=cv.getContext('2d',{willReadFrequently:true});
  const grids=[],cores=[];
  got.forEach(f=>{cx.clearRect(0,0,cw,ch);cx.drawImage(f.im,0,0,cw,ch);const d=cx.getImageData(0,0,cw,ch).data,g=new Float32Array(gw*gh),gc=new Float32Array(gw*gh);
    for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){const k=(y*cw+x)*4;if(d[k+3]>128){const r=d[k],gg=d[k+1],bb=d[k+2],mx=Math.max(r,gg,bb),mn=Math.min(r,gg,bb);
      if(mx-mn>70){const id=((y/5)|0)*gw+((x/5)|0);g[id]++;if(r>=170&&gg<=150&&bb<=130)gc[id]++}}}
    grids.push(g);cores.push(gc)});
  const wgt=grids.map((g,k)=>{const o=new Float32Array(g.length);for(let i=0;i<g.length;i++)o[i]=g[i]+3*cores[k][i];return o});   // cold core counts triple
  const shift=(g,x,y,rad,it)=>{for(let n=0;n<it;n++){let sw=0,sx=0,sy=0;
    for(let j=Math.max(0,Math.floor(y-rad));j<=Math.min(gh-1,Math.ceil(y+rad));j++)for(let i=Math.max(0,Math.floor(x-rad));i<=Math.min(gw-1,Math.ceil(x+rad));i++){
      if((i+.5-x)**2+(j+.5-y)**2>rad*rad)continue;const w=g[j*gw+i];sw+=w;sx+=w*(i+.5);sy+=w*(j+.5)}
    if(sw<60)return null;x=sx/sw;y=sy/sw}return[x,y]};
  const L=grids.length-1,gl=grids[L],gcL=cores[L];
  // strongest cold-cloud mass (cold core counts triple) within maxR degrees of the chosen place; widen the search if nothing is close
  const scan=maxR=>{let best=-1,bx=0,by=0;
    for(let j=0;j<gh;j+=2)for(let i=0;i<gw;i+=2){
      const la=b.lat1-(j+.5)*cell,lo=b.lon0+(i+.5)*cell;
      if(Math.hypot((lo-loc.lon)*Math.cos(loc.lat*R),la-loc.lat)>maxR)continue;
      let s=0;for(let dj=-6;dj<=6;dj++)for(let di=-6;di<=6;di++){if(di*di+dj*dj>36)continue;const x=i+di,y=j+dj;if(x>=0&&y>=0&&x<gw&&y<gh)s+=gl[y*gw+x]+2*gcL[y*gw+x]}
      if(s>best){best=s;bx=i+.5;by=j+.5}}
    return[best,bx,by]};

  const best=sc[0],bx=sc[1],by=sc[2];
  if(best<60)return null;
  let p=shift(wgt[L],bx,by,9,12);if(!p)return null;
  const ctr=new Array(L+1).fill(null);ctr[L]=p;
  for(let k=L-1;k>=0;k--){const q=shift(wgt[k],p[0],p[1],9,10);if(!q)break;p=q;ctr[k]=p}
  const first=ctr.findIndex(c=>c),ref=k=>ctr[k]||ctr[first];
  const series=grids.map((g,k)=>{const [x,y]=ref(k);let t=0,c=0;
    for(let j=Math.max(0,Math.floor(y-14));j<=Math.min(gh-1,Math.ceil(y+14));j++)for(let i=Math.max(0,Math.floor(x-14));i<=Math.min(gw-1,Math.ceil(x+14));i++){
      if((i+.5-x)**2+(j+.5-y)**2>196)continue;t+=g[j*gw+i];c+=cores[k][j*gw+i]}

  const pts=[];ctr.forEach((c,k)=>{if(c)pts.push({k,t:(got[k].tt-got[L].tt)/36e5,lon:b.lon0+c[0]*cell,lat:b.lat1-c[1]*cell})});
  const WIN=-6.2;   // fit the motion over the last ~6 h (was 3 h: too noisy, it under-estimated the speed)
  const recent=pts.filter(q=>q.t>WIN);
  const ols=P=>{const n=P.length,tb=P.reduce((s,q)=>s+q.t,0)/n,Stt=P.reduce((s,q)=>s+(q.t-tb)**2,0)||1;
    const f=k=>{const vb=P.reduce((s,q)=>s+q[k],0)/n,bb=P.reduce((s,q)=>s+(q.t-tb)*(q[k]-vb),0)/Stt;return{a:vb-bb*tb,b:bb}};
    return{lon:f('lon'),lat:f('lat'),Stt}};

  let P=recent,fit=ols(P);
  for(let r=0;r<2;r++){const rs=recent.map(q=>res(fit,q)),rms=Math.sqrt(rs.reduce((s,x)=>s+x*x,0)/rs.length),keep=recent.filter((q,i)=>rs[i]<=Math.max(.3,2.5*rms));if(keep.length>=6){P=keep;fit=ols(P)}}
  const resid=Math.sqrt(P.reduce((s,q)=>s+res(fit,q)**2,0)/P.length),se=resid/Math.sqrt(fit.Stt);

  pts.forEach((q,i)=>{let sx=0,sy=0,c=0;const g=q.t>WIN;for(let d=-2;d<=2;d++){const o=pts[i+d];if(o&&(o.t>WIN)===g){sx+=o.lon;sy+=o.lat;c++}}disp[q.k]={lat:sy/c,lon:sx/c}});
  return{disp,series,fit,se,first};
}

/* real model wind forecast (Open-Meteo, pressure levels) -> steering flow field + vertical wind shear */
async function fetchSteering(lat0,lon0){
  const offs=[-12,-6,0,6,12],la=[],lo=[];
  for(const dy of offs)for(const dx of offs){la.push(Math.max(-85,Math.min(85,lat0+dy)).toFixed(2));lo.push(wrapLon(lon0+dx).toFixed(2))}
  const vars=[850,700,500,300].map(L=>`wind_speed_${L}hPa,wind_direction_${L}hPa`).join(',');
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la.join(',')}&longitude=${lo.join(',')}&hourly=${vars}&wind_speed_unit=ms&forecast_hours=54&timezone=GMT`);
  if(!r.ok)throw new Error('wind HTTP '+r.status);
  let data=await r.json();if(!Array.isArray(data))data=[data];
  const t0=Date.parse(data[0].hourly.time[0]+'Z'),nh=data[0].hourly.time.length,U=[],V=[],U8=[],V8=[],U3=[],V3=[];
  data.forEach(d=>{const u=new Float32Array(nh),v=new Float32Array(nh),u8=new Float32Array(nh),v8=new Float32Array(nh),u3=new Float32Array(nh),v3=new Float32Array(nh);
    for(let i=0;i<nh;i++){let su=0,sv=0,c=0;for(const L of [850,700,500,300]){const s=d.hourly[`wind_speed_${L}hPa`][i],dr=d.hourly[`wind_direction_${L}hPa`][i];if(s==null||dr==null)continue;
      const uu=-s*Math.sin(dr*R),vv=-s*Math.cos(dr*R);su+=uu;sv+=vv;c++;if(L===850){u8[i]=uu;v8[i]=vv}if(L===300){u3[i]=uu;v3[i]=vv}}
      u[i]=c?su/c:0;v[i]=c?sv/c:0}
    U.push(u);V.push(v);U8.push(u8);V8.push(v8);U3.push(u3);V3.push(v3)});
  const hnow=Math.max(0,(Date.now()-t0)/36e5);
  const samp=(lat,lon,h,UU,VV)=>{
    const fx=Math.max(0,Math.min(4,(lon-(lon0-12))/6)),fy=Math.max(0,Math.min(4,(lat-(lat0-12))/6));
    const ix=Math.min(3,Math.floor(fx)),iy=Math.min(3,Math.floor(fy)),ax=fx-ix,ay=fy-iy;
    const ti=Math.max(0,Math.min(nh-1.001,hnow+h)),t1=Math.floor(ti),at=ti-t1;
    const g=(M,y,x)=>{const k=y*5+x;return M[k][t1]*(1-at)+M[k][t1+1]*at};
    const bil=M=>(g(M,iy,ix)*(1-ax)+g(M,iy,ix+1)*ax)*(1-ay)+(g(M,iy+1,ix)*(1-ax)+g(M,iy+1,ix+1)*ax)*ay;

  };

  flow.shear=(lat,lon,h)=>{const a=samp(lat,lon,h,U8,V8),c=samp(lat,lon,h,U3,V3);return Math.hypot(c.u-a.u,c.v-a.v)};   // 850 -> 300 hPa wind difference (m/s)

  return flow;
}

const res=$('res');let timer;
function show(list){
  res.innerHTML='';
  list.forEach(x=>{const d=document.createElement('div');d.textContent=x.label;d.onclick=()=>{res.style.display='none';$('q').value=x.label;loadWeather(x.label,x.lat,x.lon)};res.appendChild(d)});
  res.style.display=list.length?'block':'none';
}
$('q').addEventListener('input',e=>{
  const v=e.target.value.trim();clearTimeout(timer);
  if(v.length<2){res.style.display='none';return}
  timer=setTimeout(async()=>{
    try{
      const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=8&language=en&format=json&name='+encodeURIComponent(v));
      const j=await r.json();
      show((j.results||[]).map(x=>({label:[x.name,x.admin1,x.country].filter(Boolean).join(', '),lat:x.latitude,lon:x.longitude})));
    }catch(err){
      const m=CITIES.filter(c=>c[0].toLowerCase().includes(v.toLowerCase())).map(c=>({label:c[0],lat:c[1],lon:c[2]}));
      show(m);
      if(!m.length)$('msg').textContent='Search is offline — open this file in a normal browser tab with internet.';
    }
  },300);
});
addEventListener('click',e=>{if(!e.target.closest('#res')&&e.target.id!=='q')res.style.display='none'});

/* click the globe to pick any spot */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY]});
canvas.addEventListener('pointerup',e=>{
  if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5)return;
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse,camera);
  const h=ray.intersectObject(earth)[0];if(!h)return;
  const p=earth.worldToLocal(h.point.clone());
  const lat=Math.asin(p.y/2)*180/Math.PI,lon=Math.atan2(-p.z,p.x)*180/Math.PI;
  loadWeather('Selected spot',lat,lon);
});

$('reset').onclick=()=>{
  mode='idle';target.z=6;rainOn=false;raining=false;pin.visible=ring.visible=false;
  $('card').classList.remove('show');$('hint').style.opacity=1;$('q').value='';
